<div [class.showNavBar]="showSide">
  <section class="header_component">
    <div class="sidebar" [ngClass]="{ open: openMenu }">
      <div class="logo">Verso</div>
      <ul class="list">
        <li
          routerLink="/uspace/home"
          routerLinkActive="active"
          data-title="{{ 'HOME' | translate }}"
        >
          <i class="mx-2 fas fa-home trans"></i>
          <p>{{ "HOME" | translate }}</p>
        </li>
        <li
          routerLink="createportfolio"
          routerLinkActive="active"
          data-title="{{ 'ABOUT' | translate }}"
        >
          <i class="mx-2 fas fa-users trans"></i>
          <p>{{ "ABOUT" | translate }}</p>
        </li>

        <li
          routerLink="/profile"
          routerLinkActive="active"
          data-title="{{ 'PROFILE' | translate }}"
        >
          <i class="mx-2 fas fa-user trans"></i>
          <p>{{ "PROFILE" | translate }}</p>
        </li>
        <li
          routerLink="/portfolio"
          routerLinkActive="active"
          data-title="{{ 'PORTFOLIO' | translate }}"
        >
          <i class="mx-2 fas fa-palette trans"></i>
          <p>{{ "PORTFOLIO" | translate }}</p>
        </li>
        <li
          routerLink="/uspace/company"
          routerLinkActive="active"
          data-title="{{ 'COMPANIES' | translate }}"
        >
          <i class="mx-2 fas fa-briefcase trans"></i>
          <p>{{ "COMPANIES" | translate }}</p>
        </li>
        <!-- <li
          routerLink="/setting"
          routerLinkActive="active"
          data-title="{{ 'SETTING' | translate }}"
        >
          <i class=" mx-2 fas fa-cog trans"></i>
          <p>{{ "SETTING" | translate }}</p>
        </li> -->
      </ul>
      <button class="profile" (click)="logout()" >
        <i class="fas fa-right-from-bracket mx-2 trans"></i>
        <p>{{ "LOGOUT" | translate }}</p>
      </button>

      <button class="btnMenu" title="open" (click)="toggleMenu()">
        @if (openMenu == true) {
        <i class="fa fa-close"></i>
        } @else {
        <i class="fa fa-angle-double-right"></i>
        }
      </button>
    </div>
  </section>
  <!-- <div class="modeContainer">
    <div class="d-flex align-items-center justify-content-center" >
      <app-mode-btn />
      <div>
        <button (click)="showNavBar()">
          <i class=" mx-2 fas fa-rotate"></i>
        </button>
      </div>
    </div>
    <app-lang-btn />
  </div> -->
</div>
