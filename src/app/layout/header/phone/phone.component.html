<section>
  <ul class="main" [class.min]="toggle">
    <li
      routerLink="home"
      routerLinkActive="active"
      data-title="{{ 'HOME' | translate }}"
    >
      <i class="fas fa-home trans"></i>
    </li>
    <li
      routerLink="createportfolio"
      routerLinkActive="active"
      data-title="{{ 'ABOUT' | translate }}"
    >
      <i class="fas fa-users trans"></i>
    </li>

    <li
      routerLink="/profile"
      routerLinkActive="active"
      data-title="{{ 'PROFILE' | translate }}"
    >
      <i class="fas fa-user trans"></i>
    </li>
    <li (click)="changeToggle()">
      <i [ngClass]="toggle ? 'fas fa-close' : 'fa fa-ellipsis-h'"></i>
    </li>
  </ul>

  <ul class="main" [class.more]="toggle">
    <li
      routerLink="/portfolio"
      routerLinkActive="active"
      data-title="{{ 'PORTFOLIO' | translate }}"
    >
      <i class="fas fa-palette trans"></i>
    </li>
    <li
      routerLink="/uspace/company"
      routerLinkActive="active"
      data-title="{{ 'COMPANIES' | translate }}"
    >
      <i class="fas fa-briefcase trans"></i>
    </li>
    <li (click)="logout()" data-title="{{ 'LOGOUT' | translate }}">
      <i class="fas fa-right-from-bracket trans"></i>
    </li>
    <li (click)="changeToggle()">
      <i [ngClass]="toggle ? 'fas fa-close' : 'fa fa-ellipsis-h'"></i>
    </li>
  </ul>
</section>

<div class="modeContainer">
  <app-mode-btn />
  <app-lang-btn />
</div>
