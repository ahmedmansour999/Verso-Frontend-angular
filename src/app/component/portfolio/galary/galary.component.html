<section>
  <div class="header">
    <p class="itembg"><i class="fas fa-image"></i> Galary</p>
    <div class="btns">
      <button [disabled]="leftDisable" (click)="left()" aria-label="Previous certifications">
        <i class="fas fa-arrow-left"></i>
      </button>
      <button [disabled]="rightDisable" (click)="right()" aria-label="Next certifications">
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>
  </div>

  @if(isLoading) {
    <div class="loading-state">
      <i class="fas fa-spinner fa-spin"></i>
    </div>
  } @else if (certificationsData.length === 0) {
    <div class="empty-state">
      No certifications available
    </div>
  } @else {
    <div class="galary row" role="list" aria-live="polite">
      @for(certification of certificationsData; track trackById($index, certification)) {
        <div #cardWidth class="galary-item col-md-4 col-lg-3" role="listitem"
             [style.transform]="'translateX(' + translateX + 'px)'">
          <img [src]="baseUrl + certification.image"
               [alt]="certification.title || 'Certification image'"
               loading="lazy" />
        </div>
      }
    </div>
  }
</section>
