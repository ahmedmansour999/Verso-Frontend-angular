<section>
  <div class="header">
    <p class="itembg">project <i class="fas fa-arrow-right"></i></p>
    <div class="btns">
      <button [disabled]="leftDisable" (click)="left()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <button [disabled]="rightDisable" (click)="right()">
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>
  </div>
  <div class="projects_container">
    <div class="projects">
      @for (column of groupedSlides; track column.id; let colIndex = $index) {
      <div
        class="project_column"
        [style.transform]="'translateX(' + translateX + 'px)'"
      >
        @for (slide of column.cards; track slide.id) {
        <div #cardWidth class="project_card">
          <div class="slide-card itembg">
            <div class="imgCont">
              <img
                [src]="baseUrl + slide.image"
                loading="lazy"
                [alt]="slide.title"
                class="slide-image"
              />
            </div>
            <div class="slide-title">
              <div>
                <p>{{ slide.title }}</p>
                <span>{{ slide.short_description }}</span>
              </div>
              <a [href]="slide.link" target="_blank">
                <i class="fas fa-arrow-right"></i>
              </a>
            </div>
          </div>
        </div>
        }
      </div>
      }
    </div>
  </div>
</section>
